<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <meta name="theme-color" content="#d5ce83">
        <title>Rumah — Houses / Hunian · Jelajah Sejarah Malang</title>
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
        <style>
            :root{--heritage:#d5ce83;--ink:#25271f;--muted:#77776c}*{box-sizing:border-box}body{margin:0;background:#f4f2e9;color:var(--ink);font-family:Arial,Helvetica,sans-serif}header{background:var(--heritage);padding:13px 22px;display:flex;align-items:center;justify-content:space-between}header a{color:#514c2c;text-decoration:none;font:700 21px Georgia,serif}.back{font:12px Arial,sans-serif;background:#fff9dc;padding:9px 12px;border-radius:3px}main{max-width:1450px;margin:auto;padding:18px}.intro{margin-bottom:14px}.intro small{font-size:10px;letter-spacing:1.5px;color:#77714b}h1{font:700 clamp(23px,3vw,32px) Georgia,serif;margin:7px 0}.intro p{font-size:12px;color:var(--muted);margin:0}.layout{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(270px,.8fr);gap:12px}.mapframe{border:8px solid #d5d2c8;min-height:550px}#map{height:550px;width:100%}aside{background:white;border:1px solid #dedbd0}.panelhead{background:#cf3737;color:white;padding:17px}.panelhead small{font-size:9px;letter-spacing:1px;text-transform:uppercase}.panelhead h2{font:700 22px Georgia,serif;margin:6px 0 0}.place{padding:16px;border-bottom:1px solid #e8e6df}.place strong{font-size:13px;display:block}.place small{display:block;color:#777;font-size:10px;margin-top:5px}.place button{margin-top:10px;border:0;background:#f1efdf;padding:8px 10px;cursor:pointer;font-size:11px}.note{padding:14px;background:#efeee8;font-size:10px;line-height:1.5;color:#69695e}.leaflet-popup-content-wrapper{border-radius:4px}.popup-title{font:700 14px Georgia,serif}.popup-type{font-size:10px;color:#777;margin-top:4px}@media(max-width:800px){header{padding:12px}header a{font-size:17px}main{padding:12px}.layout{grid-template-columns:1fr}.mapframe{min-height:420px;border-width:5px}#map{height:420px}}
        </style>
    </head>
    <body>
        <header>
            <a href="../index.html">Kampoeng Heritage <small style="display:block;font:italic 10px Georgia,serif">Architectural heritage map</small></a>
            <a class="back" href="../index.html">← Kembali ke halaman utama</a>
        </header>
        <main>
            <section class="intro">
                <small>KAMPOENG HERITAGE · MALANG</small>
                <h1>Rumah — Houses / Hunian</h1>
                <p>Pilih pin pada peta atau nama lokasi pada panel untuk melihat keterangannya.</p>
            </section>
            <section class="layout">
                <div class="mapframe">
                    <div id="map" aria-label="Peta Rumah — Houses / Hunian"></div>
                </div>
                <aside>
                    <div class="panelhead">
                        <small>Detail kategori</small>
                        <h2>Rumah — Houses / Hunian</h2>
                    </div>
                    <div id="places"></div>
                </aside>
            </section>
        </main>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <script>
            const places=[
                {
                    "name": "Rumah D'Penghulu",
                    "type": "Bangunan Bersejarah",
                    "coords": [-7.978539, 112.628919],
                    "desc": "Lokasi hunian bersejarah",
                    "image": "../gambar/2-1.png",
                    "detail": "../tempat/rumah-dpenghulu/index.html"
                },
                {
                    "name": "Rumah Jengki", 
                    "type": "Bangunan bersejarah", 
                    "coords": [-7.978450, 112.628757], 
                    "desc": "Bangunan yang menjadi bagian dari ragam warisan arsitektur di Kota Malang.",
                    "image": "../gambar/2-2.png",
                    "detail": "../tempat/rumah-jengki/index.html"
                },
                {
                    "name": "Rumah 1870", 
                    "type": "Bangunan bersejarah", 
                    "coords": [-7.978368, 112.628672], 
                    "desc": "Bangunan yang menjadi bagian dari ragam warisan arsitektur di Kota Malang.",
                    "image": "../gambar/2-3.png",
                    "detail": "../tempat/rumah-1870/index.html"
                },
                {
                    "name": "Rumah Rindu", 
                    "type": "Bangunan bersejarah", 
                    "coords": [-7.978585, 112.628503], 
                    "desc": "Bangunan yang menjadi bagian dari ragam warisan arsitektur di Kota Malang.",
                    "image": "../gambar/2-4.png",
                    "detail": "../tempat/rumah-rindu/index.html"
                },

            ];
            const color='#cf3737';
            const map=L.map('map').setView([-7.9755,112.6305],17);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
            const markers=[];
function icon(number) {
    return L.divIcon({
        className: '',
        html: `
            <div style="
                width:30px;
                height:30px;
                background:${color};
                border:3px solid white;
                border-radius:50% 50% 50% 5px;
                transform:rotate(-45deg);
                box-shadow:0 2px 6px #0005;
                display:flex;
                align-items:center;
                justify-content:center;
            ">
                <span style="
                    transform:rotate(45deg);
                    color:white;
                    font:bold 12px Arial;
                ">${number}</span>
            </div>
        `,
        iconSize: [30, 30],
        iconAnchor: [15, 28],
        popupAnchor: [0, -25]
    });
}
const list=document.getElementById('places');
            
places.forEach((p, i) => {
    const m = L.marker(p.coords, {
        icon: icon(i + 1)
    }).addTo(map);

    const mapsUrl =
        `https://www.google.com/maps/dir/?api=1&destination=${p.coords[0]},${p.coords[1]}`;

    m.bindPopup(`
        <div style="width:240px;max-width:100%">
            <img
                src="${p.image}"
                alt="${p.name}"
                style="
                    width:100%;
                    height:145px;
                    object-fit:cover;
                    border-radius:7px;
                    margin-bottom:9px;
                "
            >

            <div class="popup-title">${p.name}</div>
            <div class="popup-type">${p.type}</div>

            <p style="font-size:11px;line-height:1.5">
                ${p.desc}
            </p>

            <div style="display:flex;gap:7px;flex-wrap:wrap">
                <a href="${p.detail}"
                   style="
                       background:#cf3737;
                       color:white;
                       padding:9px 10px;
                       border-radius:4px;
                       text-decoration:none;
                       font-size:11px;
                       font-weight:bold;
                   ">
                   Lihat detail
                </a>

                <a href="${mapsUrl}"
                   target="_blank"
                   rel="noopener noreferrer"
                   style="
                       background:#f1efdf;
                       color:#25271f;
                       padding:9px 10px;
                       border-radius:4px;
                       text-decoration:none;
                       font-size:11px;
                       font-weight:bold;
                   ">
                   Buka di Maps ↗
                </a>
            </div>
        </div>
    `, {
        maxWidth: 280
    });

    markers.push(m);

    const el = document.createElement('div');
    el.className = 'place';
    el.innerHTML = `
        <strong>${i + 1}. ${p.name}</strong>
        <small>${p.type}</small>
        <button type="button">Lihat pada peta →</button>
    `;

    el.querySelector('button').addEventListener('click', () => {
        map.flyTo(p.coords, 17, { duration: 0.5 });
        m.openPopup();

        if (innerWidth <= 800) {
            document.querySelector('.mapframe')
                .scrollIntoView({
                    behavior: 'smooth',
                    block: 'start'
                });
        }
    });

    list.appendChild(el);
});

if (places.length) {
    map.setView(places[0].coords, 18);
}

</script></body></html>
